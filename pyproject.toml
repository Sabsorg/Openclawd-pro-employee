[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclawd-employee"
version = "0.1.0"
description = "An agentic AI employee framework for autonomous workflow execution"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
config = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
openclawd-employee = "openclawd_employee.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
